<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rehan College Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d0d;
      background-image:
        radial-gradient(ellipse at 30% 20%, #1a2a5e 0%, transparent 55%),
        radial-gradient(ellipse at 80% 80%, #0a1030 0%, transparent 55%);
      font-family: "Poppins", sans-serif;
      padding: 20px;
    }
    .outer-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 340px;
      animation: floatIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes floatIn {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .calculator {
      width: 100%;
      background: #fff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,0.6), 0 0 0 3px #F5C500, 0 0 0 6px #1B2F6E;
    }

    /* HEADER */
    .header {
      background: #1B2F6E;
      padding: 12px 14px 10px;
      display: flex;
      align-items: center;
      gap: 11px;
      border-bottom: 3px solid #F5C500;
    }
    .logo-box {
      width: 52px; height: 52px; border-radius: 12px; background: #fff;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; flex-shrink: 0;
      box-shadow: 0 3px 10px rgba(0,0,0,0.4); padding: 3px;
    }
    .logo-box img { width: 100%; height: 100%; object-fit: contain; border-radius: 9px; }
    .header-text { flex: 1; }
    .header-text h1 { font-size: 15px; font-weight: 800; color: #F5C500; line-height: 1.2; }
    .header-text .subtitle { font-size: 9px; color: #A8D4F5; letter-spacing: 1.3px; text-transform: uppercase; margin-top: 1px; }
    .header-text .creator { font-size: 9px; color: #ffd75e; letter-spacing: 0.5px; margin-top: 3px; font-weight: 600; opacity: 0.88; }
    .hist-icon-btn {
      background: rgba(245,197,0,0.12); border: 1px solid rgba(245,197,0,0.3);
      border-radius: 10px; width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; transition: background 0.15s, transform 0.15s; position: relative;
    }
    .hist-icon-btn:hover { background: rgba(245,197,0,0.22); }
    .hist-icon-btn.active { background: rgba(245,197,0,0.28); transform: scale(0.94); }
    .hist-icon-btn svg { width: 18px; height: 18px; }
    .hist-badge {
      position: absolute; top: -5px; right: -5px; background: #F5C500; color: #1B2F6E;
      font-size: 8px; font-weight: 800; width: 14px; height: 14px;
      border-radius: 50%; display: none; align-items: center; justify-content: center;
    }
    .hist-badge.show { display: flex; }

    /* CURRENCY BUTTON */
    .curr-icon-btn {
      background: rgba(245,197,0,0.12); border: 1px solid rgba(245,197,0,0.3);
      border-radius: 10px; width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; transition: background 0.15s, transform 0.15s; position: relative;
    }
    .curr-icon-btn:hover { background: rgba(245,197,0,0.22); }
    .curr-icon-btn.active { background: rgba(245,197,0,0.28); transform: scale(0.94); }
    .curr-icon-btn svg { width: 18px; height: 18px; }

    /* CURRENCY PANEL */
    .currency-panel {
      width: 100%; background: #0d1526; overflow: hidden;
      max-height: 0; transition: max-height 0.4s cubic-bezier(0.4,0,0.2,1);
      border-bottom: 0px solid #F5C500;
    }
    .currency-panel.open { max-height: 320px; border-bottom: 2px solid #F5C500; }
    .currency-amount-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    }
    .currency-amount-label { font-size: 10px; color: #A8D4F5; font-family: "Poppins", sans-serif; width: 32px; flex-shrink: 0; }
    .currency-amount-input {
      flex: 1; background: #1a2640; border: 1px solid rgba(245,197,0,0.4);
      color: #F5C500; border-radius: 8px; padding: 6px 10px;
      font-family: "Share Tech Mono", monospace; font-size: 14px; font-weight: 700;
      outline: none; text-align: right;
    }
    .currency-amount-input:focus { border-color: #F5C500; box-shadow: 0 0 0 2px rgba(245,197,0,0.15); }
    .currency-from-label { font-size: 11px; color: #aaa; font-family: "Poppins", sans-serif; flex-shrink: 0; }
    .currency-inner { padding: 12px 16px 14px; }
    .currency-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    }
    .currency-row label { font-size: 10px; color: #A8D4F5; font-family: "Poppins", sans-serif; width: 32px; flex-shrink: 0; }
    .currency-select {
      flex: 1; background: #1a2640; border: 1px solid rgba(245,197,0,0.3);
      color: #fff; border-radius: 8px; padding: 6px 8px;
      font-family: "Poppins", sans-serif; font-size: 12px; font-weight: 600;
      cursor: pointer; outline: none;
    }
    .currency-select:focus { border-color: #F5C500; }
    .currency-swap-btn {
      background: rgba(245,197,0,0.15); border: 1px solid rgba(245,197,0,0.3);
      border-radius: 8px; width: 32px; height: 32px; color: #F5C500;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 16px; transition: background 0.15s; flex-shrink: 0;
    }
    .currency-swap-btn:hover { background: rgba(245,197,0,0.28); }
    .currency-result-box {
      background: #111e35; border-radius: 10px; padding: 10px 14px;
      text-align: center; border: 1px solid rgba(245,197,0,0.15);
    }
    .currency-result-value {
      font-family: "Share Tech Mono", monospace; font-size: 20px; font-weight: 700;
      color: #F5C500; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;
    }
    .currency-result-meta {
      font-size: 10px; color: #4a6a9a; margin-top: 3px;
      font-family: "Poppins", sans-serif;
    }
    .use-in-calc-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; flex-shrink: 0;
      background: linear-gradient(160deg, rgba(245,197,0,0.2), rgba(245,197,0,0.08));
      border: 1px solid rgba(245,197,0,0.4);
      border-radius: 6px; cursor: pointer;
      transition: all 0.15s ease;
      color: #F5C500;
    }
    .use-in-calc-btn:hover {
      background: linear-gradient(160deg, rgba(245,197,0,0.4), rgba(245,197,0,0.2));
      box-shadow: 0 0 10px rgba(245,197,0,0.3);
      transform: scale(1.1);
    }
    .use-in-calc-btn:active { transform: scale(0.93); }
    .currency-loading { font-size: 11px; color: #4a6a9a; text-align: center; padding: 8px 0; font-family: "Poppins", sans-serif; }
    .currency-error { font-size: 11px; color: #ff5252; text-align: center; padding: 6px 0 4px; font-family: "Poppins", sans-serif; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .retry-btn {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(245,197,0,0.1);
      border: 1px solid rgba(245,197,0,0.3);
      color: #F5C500; font-family: "Poppins", sans-serif;
      font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
      padding: 3px 10px; border-radius: 20px; cursor: pointer;
      transition: all 0.15s ease;
    }
    .retry-btn:hover { background: rgba(245,197,0,0.22); box-shadow: 0 0 8px rgba(245,197,0,0.2); }
    .retry-btn:active { transform: scale(0.95); }
    .retry-btn svg { transition: transform 0.4s ease; }
    .retry-btn:hover svg { transform: rotate(180deg); }

    /* HISTORY PANEL */
    .history-panel {
      width: 100%; background: #0d1526; overflow: hidden;
      max-height: 0; transition: max-height 0.35s cubic-bezier(0.4,0,0.2,1);
      border-bottom: 0px solid #F5C500;
    }
    .history-panel.open { max-height: 220px; border-bottom: 2px solid #F5C500; }
    .history-inner { padding: 6px 0 10px; }
    .history-list { max-height: 160px; overflow-y: auto; }
    .history-list::-webkit-scrollbar { width: 3px; }
    .history-list::-webkit-scrollbar-thumb { background: #F5C500; border-radius: 4px; }
    .history-empty { text-align: center; color: #3a4a6a; font-size: 11px; padding: 16px; }
    .history-item {
      padding: 7px 16px; display: flex; justify-content: space-between;
      align-items: center; cursor: pointer; transition: background 0.12s;
      border-bottom: 1px solid rgba(255,255,255,0.03); gap: 8px;
    }
    .history-item:hover { background: rgba(245,197,0,0.07); }
    .history-item:last-child { border-bottom: none; }
    .history-expr { font-family: "Share Tech Mono", monospace; font-size: 11px; color: #6a8aaa; }
    .history-ans  { font-family: "Share Tech Mono", monospace; font-size: 13px; font-weight: 700; color: #F5C500; white-space: nowrap; }
    .history-clear-row { display: flex; justify-content: flex-end; padding: 0 14px 2px; }
    .history-clear-btn {
      font-size: 10px; color: #ff5252; background: rgba(255,82,82,0.1);
      border: 1px solid rgba(255,82,82,0.25); padding: 3px 10px; border-radius: 20px;
      cursor: pointer; font-family: "Poppins", sans-serif; font-weight: 600; transition: all 0.15s;
    }
    .history-clear-btn:hover { background: rgba(255,82,82,0.22); }

    /* DISPLAY */
    .display {
      background: #090f20; padding: 10px 18px 10px; min-height: 108px;
      display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end;
      border-bottom: 2px solid #F5C500; position: relative;
    }
    .display::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0;
      height: 2px; background: linear-gradient(90deg, transparent, #F5C500, transparent);
    }

    .expression {
      font-family: "Share Tech Mono", monospace; font-size: 15px; color: #ffffff;
      min-height: 16px; text-align: right;
    }
    .result {
      font-family: "Share Tech Mono", monospace; font-size: 40px; color: #F5C500;
      letter-spacing: -1px; text-shadow: 0 0 22px rgba(245,197,0,0.35);
      transition: text-shadow 0.15s; word-break: break-all; line-height: 1.1;
    }
    .result.pulse { text-shadow: 0 0 42px rgba(245,197,0,0.9); }

    /* BUTTONS — strict 4-col grid */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      background: #111;
      padding: 14px;
    }
    button {
      height: 64px; border: none; border-radius: 14px;
      font-family: "Poppins", sans-serif; font-size: 18px; font-weight: 700;
      cursor: pointer; transition: all 0.08s ease; letter-spacing: 0.3px;
    }
    button:active { transform: translateY(3px); box-shadow: none !important; }

    /* Number buttons */
    .btn-num {
      background: linear-gradient(160deg, #2a2a2a, #1a1a1a); color: #fff;
      box-shadow: 0 6px 0 #000, 0 8px 12px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.12);
      border: 1px solid #333;
    }
    .btn-num:hover { background: linear-gradient(160deg, #333, #222); }

    /* Operator buttons — right column, blue */
    .btn-op {
      background: linear-gradient(160deg, #243d8a, #1B2F6E); color: #F5C500; font-size: 22px;
      box-shadow: 0 6px 0 #0a1535, 0 8px 12px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
      border: 1px solid #2a3d7a;
    }
    .btn-op:hover { background: linear-gradient(160deg, #2e4da0, #243d8a); }

    /* Equals — gold, normal size */
    .btn-eq {
      background: linear-gradient(160deg, #ffd700, #F5C500); color: #1B2F6E; font-size: 26px; font-weight: 800;
      box-shadow: 0 6px 0 #b8920a, 0 8px 16px rgba(245,197,0,0.4), inset 0 1px 0 rgba(255,255,255,0.4);
      border: 1px solid #e6b800;
    }
    .btn-eq:hover { background: linear-gradient(160deg, #ffe033, #ffd700); }

    /* AC — red text */
    .btn-clear {
      background: linear-gradient(160deg, #2a2a2a, #1a1a1a); color: #ff5252; font-size: 16px;
      box-shadow: 0 6px 0 #000, 0 8px 12px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,82,82,0.15);
      border: 1px solid #333;
    }
    .btn-clear:hover { background: linear-gradient(160deg, #331515, #220f0f); }

    /* Special: +/- % */
    .btn-special {
      background: linear-gradient(160deg, #252525, #181818); color: #aaa; font-size: 15px;
      box-shadow: 0 6px 0 #000, 0 8px 12px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
      border: 1px solid #2e2e2e;
    }
    .btn-special:hover { background: linear-gradient(160deg, #303030, #202020); color: #ccc; }

    /* Delete — orange */
    .btn-del {
      background: linear-gradient(160deg, #3a1a00, #2a1200); color: #ff9a3c; font-size: 20px;
      box-shadow: 0 6px 0 #150800, 0 8px 12px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,154,60,0.15);
      border: 1px solid #4a2200;
    }
    .btn-del:hover { background: linear-gradient(160deg, #4a2200, #3a1800); color: #ffb060; }

    .footer { background: #1B2F6E; padding: 7px 8px; text-align: center; border-top: 2px solid #F5C500; }
    .footer p { font-size: 9px; color: #A8D4F5; letter-spacing: 1px; text-transform: uppercase; }
    .footer .made-by { font-size: 9px; color: #ffd75e; opacity: 0.85; letter-spacing: 0.8px; margin-top: 1px; font-weight: 600; }

    @keyframes histFlash {
      0%   { background: rgba(245,197,0,0.25); }
      100% { background: transparent; }
    }
    .history-item.flash { animation: histFlash 0.5s ease; }

    /* ── UNIT STRIP ── */
    .unit-strip {
      background: #0a0a0a;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(245,197,0,0.15);
    }
    .unit-strip-label {
      font-size: 9px;
      color: #4a6a9a;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      font-family: "Poppins", sans-serif;
      flex-shrink: 0;
      margin-right: 2px;
    }
    .unit-pill {
      flex: 1;
      height: 32px;
      border: none;
      border-radius: 8px;
      font-family: "Poppins", sans-serif;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.12s ease;
      background: linear-gradient(160deg, #1c1c1c, #111);
      color: #888;
      box-shadow: 0 3px 0 #000, inset 0 1px 0 rgba(255,255,255,0.05);
      border: 1px solid #2a2a2a;
    }
    .unit-pill:hover {
      background: linear-gradient(160deg, #252525, #181818);
      color: #F5C500;
      border-color: rgba(245,197,0,0.4);
    }
    .unit-pill:active { transform: translateY(2px); box-shadow: none !important; }
    .unit-pill.active-unit {
      background: linear-gradient(160deg, #F5C500, #d4a800);
      color: #1B2F6E;
      border-color: #F5C500;
      box-shadow: 0 3px 0 #8a6a00, 0 0 12px rgba(245,197,0,0.35);
    }
  </style>
</head>

<script>
  let current = "0", prev = "", op = null, reset = false;
  let historyArr = [];
  let histOpen = false;
  let activeUnit = null;

  const res       = document.getElementById("result");
  const expr      = document.getElementById("expression");
  const histList  = document.getElementById("historyList");
  const histPanel = document.getElementById("historyPanel");
  const histBtn   = document.getElementById("histBtn");
  const histBadge = document.getElementById("histBadge");

  const SYM = { "+":"+", "-":"−", "*":"×", "/":"÷" };
  const UNITS = { K: 1e3, M: 1e6, B: 1e9, T: 1e12 };
  const UNIT_LABELS = { K:"Thousand", M:"Million", B:"Billion", T:"Trillion" };

  // ── HISTORY ──────────────────────────────────────────────
  function toggleHistory() {
    histOpen = !histOpen;
    histPanel.classList.toggle("open", histOpen);
    histBtn.classList.toggle("active", histOpen);
  }

  // ── DISPLAY ──────────────────────────────────────────────
  function updateDisplay(val) {
    res.textContent = val;
    res.classList.add("pulse");
    setTimeout(() => res.classList.remove("pulse"), 180);
  }

  function updateExpr() {
    if (op && prev) {
      expr.textContent = prev + " " + SYM[op] + " " + current;
      // Live result in big display
      const a = parseFloat(prev), b = parseFloat(current);
      let r;
      if (op === "+") r = a + b;
      else if (op === "-") r = a - b;
      else if (op === "*") r = a * b;
      else if (op === "/") r = b === 0 ? null : a / b;
      if (r !== null && r !== undefined && !isNaN(r)) {
        res.textContent = Number.isInteger(r) ? r : parseFloat(r.toFixed(8));
      }
    }
  }

  // ── INPUT ────────────────────────────────────────────────
  function input(num) {
    clearUnitHighlight();
    if (reset) { current = String(num); reset = false; }
    else current = (current === "0") ? String(num) : current + num;
    if (current.length > 14) current = current.slice(0, 14);
    updateDisplay(current);
    updateExpr();
  }

  function inputDot() {
    clearUnitHighlight();
    if (reset) { current = "0."; reset = false; }
    else if (!current.includes(".")) current += ".";
    updateDisplay(current);
  }

  // ── HISTORY FLUSH ────────────────────────────────────────
  let pendingHistory = null;

  function flushPendingHistory() {
    if (pendingHistory) {
      historyArr.unshift(pendingHistory);
      renderHistory();
      pendingHistory = null;
    }
  }

  // ── OPERATIONS ───────────────────────────────────────────
  function setOp(o) {
    clearUnitHighlight();
    flushPendingHistory();
    if (op && !reset) calculate(true);
    prev = current; op = o; reset = true;
    expr.textContent = prev + " " + SYM[o];
  }

  function calculate(chain = false) {
    if (!op || !prev) return;
    const a = parseFloat(prev), b = parseFloat(current);
    let r;
    if (op === "+") r = a + b;
    else if (op === "-") r = a - b;
    else if (op === "*") r = a * b;
    else if (op === "/") r = b === 0 ? "Error" : a / b;
    const displayVal = typeof r === "number"
      ? (Number.isInteger(r) ? r : parseFloat(r.toFixed(8))) : r;
    if (!chain) {
      pendingHistory = { expr: prev + " " + SYM[op] + " " + current, ans: String(displayVal) };
      expr.textContent = "";
    }
    current = String(displayVal);
    op = null; prev = ""; reset = true;
    clearUnitHighlight();
    updateDisplay(current);
  }

  // ── HISTORY RENDER ───────────────────────────────────────
  function renderHistory() {
    const count = historyArr.length;
    histBadge.textContent = count > 9 ? "9+" : count;
    histBadge.classList.toggle("show", count > 0);
    if (count === 0) {
      histList.innerHTML = '<div class="history-empty">Abhi tak koi history nahi...</div>';
      return;
    }
    histList.innerHTML = historyArr.map((h, i) => `
      <div class="history-item" id="hitem-${i}" onclick="useHistory(${i})">
        <span class="history-expr">${h.expr} =</span>
        <span class="history-ans">${h.ans}</span>
      </div>`).join("");
  }

  function useHistory(i) {
    const el = document.getElementById("hitem-" + i);
    if (el) { el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 500); }
    current = historyArr[i].ans;
    op = null; prev = ""; reset = false;
    expr.textContent = historyArr[i].expr + " =";
    updateDisplay(current);
  }

  function clearHistory() { historyArr = []; renderHistory(); }

  // ── CLEAR / DELETE ───────────────────────────────────────
  function clearAll() {
    flushPendingHistory();
    current = "0"; prev = ""; op = null; reset = false;
    expr.textContent = "";
    clearUnitHighlight();
    updateDisplay("0");
  }

  function deleteLast() {
    if (reset) return;
    current = current.length > 1 ? current.slice(0, -1) : "0";
    updateDisplay(current); updateExpr();
  }

  function toggleSign() {
    current = String(parseFloat(current) * -1);
    updateDisplay(current);
  }

  function percentage() {
    current = String(parseFloat(current) / 100);
    updateDisplay(current);
  }

  // ── K M B T ──────────────────────────────────────────────
  function clearUnitHighlight() {
    activeUnit = null;
    ["K","M","B","T"].forEach(k => {
      const el = document.getElementById("unit-" + k);
      if (el) el.classList.remove("active-unit");
    });
  }

  function applyUnit(u) {
    const val = parseFloat(current);
    if (isNaN(val)) return;

    // Same unit pressed again = toggle off
    if (activeUnit === u) {
      clearUnitHighlight();
      return;
    }

    clearUnitHighlight();
    activeUnit = u;

    const multiplied = val * UNITS[u];
    const formatted = Number.isInteger(multiplied) ? multiplied : parseFloat(multiplied.toFixed(4));
    current = String(formatted);

    const btn = document.getElementById("unit-" + u);
    if (btn) btn.classList.add("active-unit");

    updateDisplay(current);
    expr.textContent = val + " × 1 " + UNIT_LABELS[u] + " = " + formatted.toLocaleString();
  }

  // ── CURRENCY CONVERTER ───────────────────────────────────
  let currOpen = false;
  let rateCache = {};

  const RETRY_SVG = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>';

  function toggleCurrency() {
    currOpen = !currOpen;
    document.getElementById("currencyPanel").classList.toggle("open", currOpen);
    document.getElementById("currBtn").classList.toggle("active", currOpen);
    if (currOpen) convertCurrency();
  }

  async function convertCurrency() {
    const from = document.getElementById("currFrom").value;
    const to   = document.getElementById("currTo").value;
    const box  = document.getElementById("currResultBox");
    const amtInput = document.getElementById("currAmount");
    const fromLabel = document.getElementById("currFromLabel");
    if (fromLabel) fromLabel.textContent = from;
    const amount = parseFloat(amtInput ? amtInput.value : 1) || 1;

    if (from === to) {
      box.innerHTML = '<div class="currency-result-value">' + amount + ' ' + to + '</div><div class="currency-result-meta">Same currency</div>';
      return;
    }

    const cacheKey = from + "_" + to;
    const now = Date.now();

    if (rateCache[cacheKey] && (now - rateCache[cacheKey].time) < 3600000) {
      showRate(amount, from, to, rateCache[cacheKey].rate, box, true);
      return;
    }

    box.innerHTML = '<div class="currency-loading">&#9696; Rate load ho raha hai...</div>';

    const apis = [
      () => fetchFrankfurter(from, to),
      () => fetchJsdelivr(from, to),
    ];

    let rate = null;
    for (const api of apis) {
      try { rate = await api(); if (rate) break; } catch(e) {}
    }

    if (rate) {
      rateCache[cacheKey] = { rate, time: now };
      showRate(amount, from, to, rate, box, false);
    } else {
      box.innerHTML = '<div class="currency-error"><span>&#9888; Rate load nahi hua.</span><button class="retry-btn" onclick="convertCurrency()">' + RETRY_SVG + ' Retry</button></div>';
    }
  }

  async function fetchFrankfurter(from, to) {
    const res = await fetch("https://api.frankfurter.app/latest?from=" + from + "&to=" + to);
    const data = await res.json();
    if (data.rates && data.rates[to]) return data.rates[to];
    return null;
  }

  async function fetchJsdelivr(from, to) {
    const res = await fetch("https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/" + from.toLowerCase() + ".json");
    const data = await res.json();
    const rates = data[from.toLowerCase()];
    if (rates && rates[to.toLowerCase()]) return rates[to.toLowerCase()];
    return null;
  }

  function showRate(amount, from, to, rate, box, cached) {
    const converted = parseFloat((amount * rate).toFixed(4));
    const singleRate = rate.toFixed(6);
    const today = new Date().toLocaleDateString("en-PK", { day:"2-digit", month:"short", year:"numeric" });
    const useBtn = '<button class="use-in-calc-btn" onclick="useInCalc(' + converted + ')" title="Calculator mein use karo">' +
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">' +
      '<polyline points="9 10 4 15 9 20"/>' +
      '<path d="M20 4v7a4 4 0 0 1-4 4H4"/>' +
      '</svg></button>';
    box.innerHTML =
      '<div class="currency-result-value">' + converted + ' ' + to + ' ' + useBtn + '</div>' +
      '<div class="currency-result-meta">1 ' + from + ' = ' + singleRate + ' ' + to + ' &nbsp;|&nbsp; ' + (cached ? "Cached" : today) + '</div>';
  }

  // Use converted result in main calculator
  function useInCalc(val) {
    current = String(val);
    op = null; prev = ""; reset = false;
    expr.textContent = "";
    updateDisplay(current);
    // Flash the main display
    res.style.transition = "color 0.2s";
    res.style.color = "#2ecc71";
    setTimeout(() => { res.style.color = ""; }, 500);
  }

  // Currency-only convert — does NOT touch main calculator display
  function convertCurrencyOnly() {
    convertCurrency();
  }

  function swapCurrencies() {
    const f = document.getElementById("currFrom");
    const t = document.getElementById("currTo");
    const tmp = f.value; f.value = t.value; t.value = tmp;
    const lbl = document.getElementById("currFromLabel");
    if (lbl) lbl.textContent = f.value;
    convertCurrency();
  }

  // ── KEYBOARD ─────────────────────────────────────────────
  document.addEventListener("keydown", e => {
    // Ignore keystrokes when currency amount input is focused
    if (document.activeElement && document.activeElement.id === "currAmount") return;
    if ("0123456789".includes(e.key)) input(e.key);
    else if (e.key === ".") inputDot();
    else if (e.key === "+") setOp("+");
    else if (e.key === "-") setOp("-");
    else if (e.key === "*") setOp("*");
    else if (e.key === "/") { e.preventDefault(); setOp("/"); }
    else if (e.key === "Enter" || e.key === "=") calculate();
    else if (e.key === "Backspace") deleteLast();
    else if (e.key === "Escape") clearAll();
    else if (e.key === "k" || e.key === "K") applyUnit("K");
    else if (e.key === "m" || e.key === "M") applyUnit("M");
    else if (e.key === "b" || e.key === "B") applyUnit("B");
    else if (e.key === "t" || e.key === "T") applyUnit("T");
  });
</script>
</body>
</html>
